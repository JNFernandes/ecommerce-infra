# Weekly, grouped updates: one pull request per ecosystem per week at most.
# There is no package manifest and no Dockerfile in this repository; the base images live in
# docker-compose.yml (and docker-compose.dev.yml), covered by the docker-compose ecosystem.
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
