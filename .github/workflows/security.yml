# Security automation for ecommerce-infra. This repository has no application code and no package
# manifest, so there is no dependency audit and no OSV-Scanner job (nothing to scan); see the
# README, "CI and security". What it does have is scanned:
#   secrets   gitleaks over the full git history, failing on any finding
#   codeql    CodeQL for the GitHub Actions workflows (language "actions")
#   images    Trivy on every third-party image the compose file runs, SARIF to the Security tab
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks 8.30.1
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --verbose --exit-code 1

  codeql:
    name: CodeQL (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: actions
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:actions

  # The images to scan are read from docker-compose.yml (every profile): each distinct image of a
  # service that is pulled, not built. New services and Dependabot tag bumps need no edit here.
  # Built images (ecommerce-*) are scanned in their own repositories.
  image-list:
    name: Image list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        # enforce: the job fails on fixable HIGH/CRITICAL. Only the gateway (traefik) is enforced:
        # it is the one component exposed to clients. The others are local-dev infrastructure;
        # their findings go to the Security tab without failing (threshold in the README).
        run: |
          matrix=$(docker compose --profile apps --profile tools --profile gateway-debug config --format json \
            | jq -c '{include: ([.services[] | select(has("build") | not) | .image] | unique
                       | map({image: ., enforce: startswith("traefik:")}))}')
          echo "$matrix" | jq .
          [ "$(echo "$matrix" | jq '.include | length')" -gt 0 ] || { echo "::error::no image found"; exit 1; }
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  images:
    name: Image scan (${{ matrix.image }})
    needs: image-list
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 1. Report: SARIF for the Security tab. Never fails, so the upload always happens.
      - name: Trivy (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ matrix.image }}
          scanners: vuln
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          hide-progress: true
          exit-code: "0"
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.image }}
      # 2. Gate (enforced images only): same scan as a readable table in the log; fails on findings.
      - name: Trivy (gate, fixable HIGH/CRITICAL)
        if: matrix.enforce
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          skip-setup-trivy: true
          image-ref: ${{ matrix.image }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          hide-progress: true
          exit-code: "1"
