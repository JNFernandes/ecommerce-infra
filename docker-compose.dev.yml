# Local debugging override: publishes the application services' ports again and lets browsers
# call them directly. The gateway on 8090 keeps working alongside.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile apps up -d
services:
  orders:
    ports: ["3000:3000"]
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  identity:
    ports: ["3001:3001"]
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  inventory:
    ports: ["8081:8081"]
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  notifications:
    ports: ["8000:8000"]
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  ai:
    ports: ["8002:8002"]
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
