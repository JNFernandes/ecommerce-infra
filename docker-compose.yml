# Shared local infrastructure for the ecommerce platform.
# Services run on the host and connect via localhost; containerised services
# (added later) connect via the internal names (kafka:29092, postgres-orders:5432, ...).
name: ecommerce

services:
  # ---------------------------------------------------------------- Kafka (KRaft, no Zookeeper)
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Creates every topic explicitly, then exits. Re-running is safe.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in orders.order-placed orders.order-confirmed orders.order-cancelled \
                 payments.payment-processed payments.payment-failed payments.payment-refunded \
                 inventory.stock-reserved inventory.stock-rejected inventory.stock-released \
                 identity.user-registered; do
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1
        done
        kafka-topics --bootstrap-server kafka:29092 --list

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ---------------------------------------------------------------- Postgres, one per service
  postgres-orders:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_pass
    ports:
      - "5432:5432"
    volumes:
      - orders-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_user -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-inventory:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
    ports:
      - "5433:5432"
    volumes:
      - inventory-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-payments:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments_user
      POSTGRES_PASSWORD: payments_pass
    ports:
      - "5434:5432"
    volumes:
      - payments-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments_user -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-identity:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity_user
      POSTGRES_PASSWORD: identity_pass
    ports:
      - "5435:5432"
    volumes:
      - identity-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_user -d identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- MongoDB (document stores)
  # Orders read model (CQRS projection) and Notifications log.
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" -u mongo_user -p mongo_pass --authenticationDatabase admin | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------- Application services (profile "apps")
  # Built from the sibling repositories. Start with: docker compose --profile apps up -d --build
  orders:
    profiles: ["apps"]
    build:
      context: ../ecommerce-orders
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres-orders:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      PORT: "3000"
      DB_HOST: postgres-orders
      DB_PORT: "5432"
      DB_USERNAME: orders_user
      DB_PASSWORD: orders_pass
      DB_NAME: orders
      KAFKA_BROKERS: kafka:29092
      MONGO_URI: mongodb://mongo_user:mongo_pass@mongo:27017/orders_read?authSource=admin
      # Browser origins allowed to call REST and /graphql; override from the host environment.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    # Orders applies its TypeORM migrations itself on startup (DB_MIGRATIONS_RUN, default true).
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # One-shot: seeds the demo customer (the compiled seed:customers script) once Orders is
  # healthy, i.e. its migrations have run, then exits. Idempotent.
  orders-seed:
    profiles: ["apps"]
    build:
      context: ../ecommerce-orders
    restart: "no"
    depends_on:
      orders:
        condition: service_healthy
    environment:
      DB_HOST: postgres-orders
      DB_PORT: "5432"
      DB_USERNAME: orders_user
      DB_PASSWORD: orders_pass
      DB_NAME: orders
    command: ["node", "dist/infra/database/seeds/seed-customers.js"]

  # Worker with no HTTP endpoint and a shell-less (chiseled) image, so no healthcheck.
  # Applies its EF Core migrations itself on startup.
  payments:
    profiles: ["apps"]
    build:
      context: ../ecommerce-payments
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres-payments:
        condition: service_healthy
    environment:
      ConnectionStrings__Payments: Host=postgres-payments;Port=5432;Database=payments;Username=payments_user;Password=payments_pass
      Kafka__BootstrapServers: kafka:29092
      # The outbox relay polls every 250 ms; keep its SQL out of the logs.
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning

  # Flyway migrates on startup. The "local" Spring profile adds the idempotent sample stock
  # (SKU-001..SKU-005, db/local/R__seed_local_stock.sql). Listens on 8081 inside the container
  # too (SERVER_PORT; 8080 belongs to kafka-ui). The image's own HEALTHCHECK probes 8080, so it
  # is overridden here to poll /actuator/health on 8081.
  inventory:
    profiles: ["apps"]
    build:
      context: ../ecommerce-inventory
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres-inventory:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres-inventory:5432/inventory
      DB_USERNAME: inventory_user
      DB_PASSWORD: inventory_pass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: "8081"
      # Browser origins allowed to call the catalog (GET only); override from the host environment.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s

  # Records a notification per order event in MongoDB (database "notifications") and serves
  # them read-only over HTTP. Creates its MongoDB indexes itself on startup. The healthcheck
  # uses /health/ready (200 only when MongoDB answers); the image has no curl/wget, so it calls
  # Python. Port 8000 (3000 is Orders, 8080 Kafka UI, 8081 Inventory).
  notifications:
    profiles: ["apps"]
    build:
      context: ../ecommerce-notifications
      dockerfile: Dockerfile
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo_user:mongo_pass@mongo:27017/?authSource=admin
      MONGODB_DATABASE: notifications
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: notifications-service
      # Browser origins allowed to call the API (GET only); override from the host environment.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  kafka-data:
  orders-pg-data:
  inventory-pg-data:
  payments-pg-data:
  identity-pg-data:
  mongo-data:
